services:
  db:
    image: postgres:16-alpine
    platform: linux/amd64
    container_name: sakrus-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      # CRIT-04: Fallback removido — se DB_PASSWORD não for definida, o container falha explicitamente
      POSTGRES_PASSWORD: "${DB_PASSWORD:?ERRO: A variavel de ambiente DB_PASSWORD deve ser definida no arquivo .env}"
      POSTGRES_DB: SakrusDb
    # LOW-04: Porta do banco NÃO exposta ao host — acessível apenas internamente via rede Docker
    # Se precisar de acesso local para desenvolvimento, use: 127.0.0.1:5439:5432
    expose:
      - "5432"
    volumes:
      - sakrus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SakrusDb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    container_name: sakrus-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - "ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=SakrusDb;Username=postgres;Password=${DB_PASSWORD:?ERRO: DB_PASSWORD nao definida}"
    ports:
      - "8085:8080"
    volumes:
      - sakrus_dataprotection:/app/dataprotection-keys
      # CRIT-02: Uploads seguros fora do wwwroot — não acessíveis via URL direta
      - sakrus_secure_uploads:/app/secure-uploads

volumes:
  sakrus_pgdata:
  sakrus_dataprotection:
  sakrus_secure_uploads: